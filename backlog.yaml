# Единый источник истины для внутреннего бэклога разработки Text Autofix.
# Бэклог только для автономной работы Cursor над этим репозиторием.
# Отдельного поля исполнителя нет: задачи берёт Cursor по правилам ниже.
#
# schema_version: 2
#
# Правила
# -------
# - Задача со status: done остаётся в items (история и регрессии), не удаляется.
# - depends_on: только id задач, которые есть в items. Исторические/удалённые id — в notes.
# - order: только у задач с parent (порядок внутри эпика). У parent: null поле order не пишем.
# - UI Canvas (pick-v1, фильтры, shots-v1 и т.п.) в YAML не хранятся.
# - Изображения — только файлы в backlog/assets/; в YAML только path + alt, без встраивания картинок.
# - Orphan notes из Canvas (id вне items) — в backlog/archive/canvas-orphan-notes.yaml.
#
# status (обязательно)
# --------------------
#   draft       — задача зафиксирована, но постановка ещё недостаточна для автономной реализации
#   ready       — постановка достаточна; Cursor имеет право брать задачу в работу
#   in_progress — Cursor начал реализацию
#   review      — реализация закончена, создан PR, требуется человеческая проверка
#   done        — изменения приняты и смержены (после человеческой проверки)
#
# Жизненный цикл (рекомендуемый)
# ------------------------------
#   draft → ready → in_progress → review → done
#
# Кто какие переходы делает
# -------------------------
# - draft → ready: только человек (готовность постановки). Cursor сам не переводит.
# - ready → in_progress → review: Cursor может выполнять самостоятельно.
# - review → done: только человек. Cursor сам не переводит в done.
# - done = результат прошёл человеческую проверку и изменения приняты/смержены.
#
# Когда Cursor может брать задачу
# -------------------------------
# - status должен быть ready;
# - все id из depends_on должны иметь status: done;
# - если depends_on пуст — дополнительных ограничений по зависимостям нет.
#
# Acceptance criteria (checks)
# ----------------------------
# - Cursor может ставить checks[].done: true по мере выполнения критериев.
# - Перед переходом in_progress → review все обязательные checks должны иметь done: true.
#
# Структура каталога
# ------------------
# backlog/
#   assets/
#     {task-id}/
#       screenshot-1.png
#   archive/
#     canvas-orphan-notes.yaml
# backlog.yaml          ← этот файл (в корне репо)
#
# path в assets — относительно корня репозитория, например:
#   backlog/assets/tech-1/technical-lexicon-status.png
#
# Схема одной задачи (items[])
# ----------------------------
# id, title, description, why, idea          — обязательно
# area: "UI / diff" | Орфография | Типографика | Прочее
# priority: высокий | средний | низкий       — обязательно
# status: draft | ready | in_progress | review | done
# parent: string | null
# order: integer                             — опционально; только если parent != null
# depends_on: string[]                       — опционально; только id из items
# checks: [{ text, done }]                   — обязательно
# notes: string                              — опционально
# assets: [{ path, alt }]                    — опционально
#
# items[] — список задач. Порядок верхнего уровня в файле не задаёт иерархию;
# для подзадач эпика используйте parent + order.

schema_version: 2

items:
- id: ne-1
  title: |
    «не» с глаголом раздельно (confirm)
  description: |
    Слитно написанное «не»+глагол вроде «неотключите» → confirm «не отключите», не auto и не карточка опечатки с полем ввода.
    В stash уже есть черновик кода (`src/spell/ne-verb-split.ts` + тесты), в релизный срез не входил — при переносе возможны конфликты с `check-spelling` / QA-verify.
  why: |
    Редполитика: «не» с глаголом раздельно. Сейчас такие слова часто уходят в орфографию как мусор или остаются слитно.
  idea: |
    Поднять черновик из stash@{0} (wip-all-before-release-slice): separateNeVerb + buildNeVerbFixes, priority ниже раскладки, выше обычного spell.
    Не резать причастия («неработающий»), словарные «ненавидеть» / «нельзя» / «неплохо».
    Подсказка в духе: если убрали «не» и получилась ерунда — значит слитно (не этот кейс).
    После merge — QA #41 и ручной прогон на «Пока неотключите уведомления».
  area: Орфография
  priority: высокий
  status: draft
  parent: null
  depends_on: []
  checks:
    - text: |
        «Пока неотключите уведомления» → confirm «не отключите», не auto, не поле «Напишите, как исправить»
      done: false
    - text: |
        Карточки опечатки на «неотключите» нет
      done: false
    - text: |
        «ненавидеть», «нельзя», «неплохо», «невысокий», «неработающий» не режем
      done: false
    - text: |
        «Будьте внимательны» не становится «будите» / «будете»
      done: false
  notes: |
    Orphan note из Canvas + код в stash untracked. Не применять stash целиком — только ne-verb файлы и точечная проводка в check-spelling.

- id: spell-2c
  title: 2c. Показать замены и choice, не дожидаясь словаря
  description: |
    Сейчас UI специально пустой, пока Hunspell не готов (QA №29: нет «правок нет» и «Спасибо» во время плашки). Можно сразу показать choice/замены, орфографию дописать второй волной. Не делать, пока явно не скажут «да» — это смена контракта экрана.
  why: |
    Даже после 2a первый запуск дня всё ещё ждёт сборку nspell. Редактор мог бы уже жать «напишите / напишете».
  idea: |
    Сразу auto/choice/confirm без орфографии + плашка. Когда словарь готов — дописать карточки орфографии в тот же UI, плашка гаснет. Только тогда «правок нет» / «Спасибо», если больше нечего. Обновить QA №14 и №29. Не начинать до 2a (иначе волны всё равно ждут сеть).
  area: Орфография
  priority: средний
  status: draft
  parent: null
  depends_on: []
  checks:
    - text: |
        Пока плашка крутится, choice «напишите мне» уже на экране, кнопки живые
      done: false
    - text: |
        «В выделенных слоях правок нет» и «Спасибо, шайтан-машина!» не вспыхивают раньше орфографии
      done: false
    - text: |
        После загрузки словаря карточка «Кватира» появляется без Reload плагина
      done: false
    - text: QA №29 и №14 обновлены под новый порядок экрана
      done: false
  notes: |
    Историческая зависимость: не начинать до spell-2a (карточки уже нет в бэклоге).
- id: dict-1
  title: |
    Эпик: «В словарь» без GitHub у дизайнера
  description: |
    Дизайнер жмёт «В словарь» → слово сразу скрыто у него. В общий text-autofix-spelling слово попадает пачкой раз в день, одним PR, только после апрува старшего редактора. Делать строго 1a → 1e.
  why: |
    Skip не копит знания редакции. Пушить в main из плагина нельзя: токен утечёт из бандла.
  idea: |
    Роли: дизайнер только в плагине; Worker — секрет и inbox; Action — один PR в день; старший редактор — апрув; main без апрува не меняется. Локальный hide (clientStorage) + очередь + POST на Worker + inbox/pending.jsonl на proposals + daily Action + CODEOWNERS. В whitelist/supplement, не в ru_RU.dic.
  area: Орфография
  priority: средний
  status: draft
  parent: null
  depends_on: []
  checks:
    - text: |
        Не начинать 1c, пока нет 1a (кнопка без локального hide бесит)
      done: false
    - text: |
        Не начинать 1d, пока нет inbox (Action не из чего собирать PR)
      done: false
    - text: |
        Токен не в плагине; в main только после апрува; не писать в ru_RU.dic
      done: false
- id: dict-1a
  title: 1a. Кнопка и скрыть у себя
  description: |
    В карточке орфографии: Исправить / Пропустить / В словарь. Сразу после «В словарь» слово не всплывает у этого человека в любом файле.
  why: Кнопка бесполезна, если ждать сутки до merge.
  idea: |
    Список своих слов в figma.clientStorage (не pluginData слоя). Skip ×3 оставить как было. Раскладка и gдоказываем — без кнопки или с «это точно слово?». Тост: «Отправили редактору. Пока скрыто только у вас».
  area: Орфография
  priority: средний
  status: draft
  parent: dict-1
  order: 1
  depends_on: []
  checks:
    - text: |
        Кнопка «В словарь» в карточке орфографии
      done: false
    - text: |
        Слово не показывается снова у этого пользователя после перезапуска плагина
      done: false
    - text: В другом файле Figma у того же человека тоже скрыто
      done: false
    - text: |
        Нет кнопки на раскладке / смешанной латинице (или есть предупреждение)
      done: false
- id: dict-1b
  title: 1b. Заявка и очередь офлайн
  description: |
    Каждое «В словарь» сохраняет заявку: слово, lower, контекст 3–5 слов, figma.currentUser, дата, версия плагина, тип (whitelist по умолчанию).
  why: |
    Редактору нужно видеть контекст. Сеть в Figma может отвалиться.
  idea: |
    Очередь в clientStorage. Есть сеть — POST на Worker, заявка уходит. Нет сети — очередь живёт, ретрай при следующем запуске. Hide из 1a уже случился. Не писать в ru_RU.dic.
  area: Орфография
  priority: средний
  status: draft
  parent: dict-1
  order: 2
  depends_on:
    - dict-1a
  checks:
    - text: В заявке есть слово + короткий контекст из слоя
      done: false
    - text: |
        Офлайн: слово скрыто, заявка не потеряна, уходит позже
      done: false
    - text: |
        Повтор «В словарь» на то же слово не плодит дубли в очереди
      done: false
- id: dict-1c
  title: |
    1c. Worker — приёмник заявок
  description: |
    Плагин шлёт POST на маленький сервис. Секрет GitHub живёт только там, не в dist/main.js.
  why: Иначе любой вытащит токен и будет писать в словарь.
  idea: |
    Cloudflare Worker / аналог. GitHub App или PAT: только contents на text-autofix-spelling. Проверки: кириллица/короткий бренд, длина, не URL, лимит N заявок с user id в сутки. Пишет строку в inbox/pending.jsonl на ветке proposals.
  area: Орфография
