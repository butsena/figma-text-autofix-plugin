- id: dict-1e
  title: 1e. Апрув редактора и слово у всех
  description: |
    Merge в main только после review старшего редактора. Плагин как сейчас качает whitelist — слово пропадает у коллег.
  why: В общий словарь не должен попасть мусор и опечатки.
  idea: |
    CODEOWNERS на spell-whitelist.txt и spell-supplement.txt. Branch protection: required review. Редактор в PR удаляет строки, правит регистр, решает whitelist vs supplement. Отклонённое автору можно не возвращать. Автор слово уже не видит с шага 1a; у коллег оно пропадает после merge, когда плагин как сейчас тянет whitelist.
  area: Орфография
  priority: средний
  status: draft
  parent: dict-1
  order: 5
  depends_on:
    - dict-1d
  checks:
