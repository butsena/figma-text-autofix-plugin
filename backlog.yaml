    - text: |
        После merge следующий запуск плагина подхватывает слово с GitHub
      done: false
    - text: Редактор может выкинуть слово из PR до merge
      done: false
- id: tech-1
  title: |
    Понятные статусы словарей в «Технической хрени»
  description: |
    Переработать отображение статусов словарей в блоке «Техническая хрень»: сделать названия и состояния понятнее и привести строки к единой информационной модели.
    Вместо шести технических сущностей показывать пять UI-строк:
    replacements → «Замены»;
    boundary-exceptions → «Без точки»;
    ambiguous-form-choices → «Формы слов»;
    ru_RU / Hunspell → «Словарь»;
    spell-supplement + spell-whitelist → «Слова-исключения».
    spell-supplement и spell-whitelist объединяются только на уровне UI. Их источники данных, файлы, загрузка и поведение остаются независимыми.
  why: |
    По текущим техническим названиям и счётчикам редактору трудно понять, какой словарь используется и продолжает ли он работать при ошибке GitHub. Новые строки должны понятно показывать количество, источник данных и состояние загрузки.
  idea: |
    Figma reference — визуальный источник правды для UI:
    https://www.figma.com/design/fe3RZqPbuPDHqUZk0XKWXF/%D0%98%D1%81%D0%BF%D1%8B%D1%82%D0%B0%D0%BD%D0%B8%D1%8F-%D0%BF%D0%BB%D0%B0%D0%B3%D0%B8%D0%BD%D0%B0?node-id=550-8&t=9XDvVxXVKdzlflTd-4
    Названия, тексты состояний, порядок строк и визуальное оформление — по финальному фрейму. Конфликты с прежней постановкой разрешены в пользу макета (решения ниже).

    Remote OK: count + бейдж GitHub по макету («124 правила», «38 фраз», «27 пар», «164 000 слов», для исключений — «N слов»).
    Fallback «Замены» / «Без точки»: «Встроенный словарь, GitHub не загрузился», бейдж «Встроенный»; count в UI не показывать (остаётся в данных статуса).
    Fallback «Формы слов»: «Встроенный список (N пар), GitHub не загрузился», бейдж «Встроенный»; N из используемого списка. Разный формат с «Заменами» допустим. Unavailable у форм нет.
    «Словарь» unavailable (только Hunspell): «Проверка недоступна» / «Нет связи со словарём» (красное). Нового fallback для Hunspell не вводить.
    «Слова-исключения»:
      — оба remote: «N слов» + GitHub; N — уникальные слова union двух списков (только для отображения);
      — оба fallback: «Встроенные списки, GitHub не загрузился» + «Встроенный»;
      — partial (один remote, второй fallback, оба сочетания): «Не все загрузились» + «Частично недоступен» без count и техназваний источников; это не unavailable всей строки, оба списка продолжают работать с существующим fallback.
    errorMessage: сохранять в модели статусов и диагностике (console/DTO), не выводить сырую техошибку в UI; в UI — фиксированные фразы макета. У объединённой строки ошибки обоих источников хранятся независимо. Без новых тултипов/блоков диагностики.

    Менять только представление статусов. Не менять загрузку, содержимое словарей, spellcheck, mixed-script/layout и существующую fallback-логику.
    Сохранить семантику: оба списка исключают слова из проверки на опечатку; spell-whitelist дополнительно исключает слова из проверки раскладки/mixed-script, а spell-supplement — нет.
    При необходимости обновить тесты отображения статусов и регрессий, не меняя поведение проверок.
  area: UI / diff
  priority: низкий
  status: done
  parent: null
  depends_on: []
  checks:
    - text: |
        В блоке ровно пять строк с согласованным соответствием источников и названий; порядок, тексты состояний и визуальное оформление соответствуют финальному фрейму Figma
      done: true
    - text: |
        Remote OK показывает count и GitHub; fallback «Замены»/«Без точки» — текст макета без count; fallback «Формы слов» — «Встроенный список (N пар), GitHub не загрузился»; у форм нет unavailable
      done: true
    - text: |
        Unavailable (красные тексты макета) возможно только у Hunspell «Словаря»
      done: true
    - text: |
        «Слова-исключения»: оба remote («N слов»+GitHub), оба fallback («Встроенные списки…»+Встроенный), partial в обоих сочетаниях («Не все загрузились»+«Частично недоступен») без count в partial
      done: true
    - text: |
        errorMessage остаётся в модели/диагностике при fallback и unavailable и не затирается у объединённой строки; в UI сырая техошибка не показывается (только фразы макета)
      done: true
    - text: |
        spell-supplement и spell-whitelist объединены только в UI; загрузка, словари, spellcheck, mixed-script/layout и fallback-логика не изменены; различие поведения supplement и whitelist сохранено
      done: true
    - text: |
        Обновлены тесты статусов (remote, fallback, partial, unavailable, сохранение errorMessage без показа в UI); нет регрессий поведения проверок
      done: true
    - text: |
        После реализации Cursor создал PR и перевёл задачу в review; merge и перевод в done оставлены человеку
      done: true
  notes: |
    Принято и смержено: https://github.com/butsena/figma-text-autofix-plugin/pull/14 (2026-10-06).
    Локальная проверка в Figma пройдена.
    Отличие шапки и фона блока от макета принято.
    Работа Hunspell из кэша без интернета ожидаема.
    Конфликты с макетом ранее разрешены в пользу финального дизайна; count в UI — только где предусмотрен состояниями.
  assets:
    - path: backlog/assets/tech-1/technical-lexicon-status.png
      alt: |
        Исторический UI: шесть статусов словарей с GitHub до tech-1
- id: layout-2
  title: Кириллица внутри латинского бренда (Figmа, onlinе)
  description: |
    После layout-1 плагин ловит латиницу, прилипшую к русскому слову («yпишете» → «пишете»). Обратный случай молчит: «Figmа» с русской «а», «onlinе» с русской «е», «сian» с русской «с», «htmл». На экране это почти как Figma / online / Cian / html.
  why: |
    Это не «заменить слово по русскому словарю». Редактор набирает английский бренд или термин в русском макете и случайно оставляет одну кириллическую букву-самозванца: выглядит как латинская, в словаре другое слово. В ревью и вёрстке такое легко пропустить, в коде и поиске по файлу — уже другой токен. Сейчас смешанная раскладка выкидывает латиницу и смотрит остаток: от «Figmа» остаётся одна «а», это короче порога в три буквы, карточки нет. Орфография тоже не видит слово: кириллический токен — от двух букв подряд. Не чинить вслепую всем словарём: иначе «Figmа» могут предложить русское слово вместо «Figma». Нужен короткий список брендов/терминов (как LATIN_ALLOWLIST: Figma, online, Cian, html…) и карточка «замени самозванца на латинскую букву». Регрессии layout-1 не ломать: yпишете, gдоказываем, целые EN-слова без кириллицы.
  idea: |
    Если в смешанном токене латиницы больше, чем кириллицы, и без кириллицы (или после замены похожих букв а/е/с/о/р/х/у…) получается слово из allowlist брендов — confirm на весь токен: Figmа → Figma. Не предлагать русское словарное слово. Не трогать yпишете и gдоказываем.
  area: Орфография
  priority: низкий
  status: draft
  parent: null
  depends_on: []
  checks:
