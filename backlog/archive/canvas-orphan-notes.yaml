notes:
- id: layout-1
  text: |
    Не отловил приставки на, написанные латиницей, исправил только пишите/пишете. Слой: «Заполните ваш yпишете или yпишите, псина!»
- id: copy-3
  text: |
    Подумай, как сделать прогрузку орфографии заметнее, чтобы не тыкали по другим кнопкам раньше времени — попробуй не подгружать все остальные аккордеоны, пока не проверится орфография
    
    Поправь текст в юае на «Проверяю орфографию — пажжите»
- id: spell-1
  text: |
    Пока проверяется орфография, другие аккордеоны не видно. В первую очередь проверяется орфография, а уже потом всё остальное. Отображение результатов такое же: орфография, затем — в уже существующем порядке.
- id: choice-1
  text: |
    Подсказку в первой иттерации сделай в виде болванки, я заполню ее посл первого теса в фигме
- id: ne-1
  text: |
    Учти что с «не» бывают наречия; придумай подсказку — что-нибудь типа «Если убрали «не» и получилась ерунда, значит не — слитно». Можешь тут пофанатзировать
    
    Затем сам создай и прогони тесты и проверь, что всё работает
