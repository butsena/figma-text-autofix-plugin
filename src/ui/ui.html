<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Autofix</title>
    <style>
      :root {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 12px;
        color: #1f1f1f;
      }
      html,
      body {
        min-height: 100%;
      }
      body {
        margin: 0;
        padding: 12px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
      }
      #app {
        display: flex;
        flex: 1 1 auto;
        flex-direction: column;
      }
      .appShell {
        display: flex;
        flex: 1 1 auto;
        flex-direction: column;
      }
      .appMain {
        flex: 0 0 auto;
      }
      .resultWaiting {
        color: #666;

      }
      .resultHeader {
        margin-bottom: 14px;
      }
      .resultTitle {
        margin: 0 0 12px;
        font-size: 18px;
        font-weight: 700;
        line-height: 1.25;
        color: #1f1f1f;
      }
      .resultStats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }
      .resultStat {
        text-align: center;
      }
      .resultStatLabel {
        font-size: 11px;

        line-height: 1.3;
        margin-bottom: 4px;
      }
      .resultStatValue {
        font-size: 20px;
        font-weight: 700;
        line-height: 1.2;
        color: #1f1f1f;
      }
      button {
        appearance: none;
        border: 1px solid #d0d0d0;
        background: #f6f6f6;
        border-radius: 6px;
        padding: 8px 10px;
        cursor: pointer;
        font-weight: 600;
      }
      .reportThanksRow {
        display: flex;
        justify-content: center;
        margin: 12px 0 14px;
      }
      button.thanksBtn {
        min-width: 132px;
        padding: 9px 16px;
        border-color: #b8d4a8;
        background: #eef6ea;
      }
      .reportBlock {
        border: 1px solid #c8d8f0;
        background: #f4f8ff;
        border-radius: 8px;
        padding: 8px 10px;
        margin-bottom: 14px;
        box-sizing: border-box;
      }
      .reportDetails > summary {
        cursor: pointer;
        list-style: none;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 10px;
        padding: 2px 0;
        user-select: none;
      }
      .reportDetails > summary::-webkit-details-marker {
        display: none;
      }
      .reportDetails > summary::before {
        content: "▸";
        color: #0b57d0;
        font-size: 15px;
        font-weight: 700;
        line-height: 1;
        flex-shrink: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
        margin-right: 4px;
        border-radius: 6px;
        background: #d6e6ff;
        border: 1px solid #7aa8f0;
        box-sizing: border-box;
      }
      .reportDetails > summary:hover::before {
        background: #c4dbff;
        border-color: #5a94eb;
      }
      .reportDetails[open] > summary::before {
        content: "▾";
        background: #b8d4ff;
      }
      .reportDetailsTitle {
        font-weight: 700;
        font-size: 13px;
        color: #1f1f1f;
      }
      .reportDetailsBrief {

      }
      .reportDetailsBody {

        border-top: 1px solid #d8e4f8;
      }
      .reportSummary {
        color: #333;

      .reportLayer {
        margin-top: 10px;

      }
      .reportLayerTitle {

        color: #0b57d0;
      }
      .reportLayerTitle:hover {
        text-decoration: underline;
      }
      .reportFix {
        padding: 6px 0 6px 8px;
        border-left: 3px solid #8fb8ff;
        margin-bottom: 6px;
        background: #fff;

      .confirmDetails > summary {

        display: flex;
        flex-wrap: wrap;

      .confirmDetails > summary::before {

        margin-right: 4px;

        font-weight: 600;
        color: #1f1f1f;
        background: #eef3fc;
        padding: 0 4px;

      }
      .ws-mark {

      }
      .ws-sp {

      }
      .ws-nbsp {

      }
      .ws-nnbsp {
        color: #9a6b00;
      }
      .ws-tab {

      }
      .ws-nl {
        color: #0b57d0;
      }
      .ws-empty {
        color: #b00020;
        font-style: italic;
        font-weight: 400;
      }
      .cards {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .card {
        border: 1px solid #dedede;

      .cardClickable {

      .cardTitle {

      }
      .fieldLabel {
        color: #444;
        font-weight: 700;
        margin-top: 10px;
        margin-bottom: 6px;
      }
      .textPreview {
        white-space: pre-wrap;
        border: 1px solid #ededed;
        border-radius: 6px;
        padding: 8px;
        background: #fcfcfc;
        max-height: 100px;
        overflow: auto;
      }
      .empty {
        color: #666;
        padding: 10px 4px;
      }
      .sectionTitle {
        font-weight: 700;
        margin: 14px 0 8px;
        font-size: 12px;
        color: #444;
      }
      .techBlock {
        flex-shrink: 0;
        margin-top: auto;
        border: 1px solid #e8e8e8;
        background: #fafafa;
        border-radius: 6px;
        padding: 6px 8px;
        box-sizing: border-box;
      }
      .techDetails > summary {
        cursor: pointer;
        list-style: none;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 2px 0;
        user-select: none;
      }
      .techDetails > summary::-webkit-details-marker {
        display: none;
      }
      .techDetails > summary::before {
        content: "▸";
        color: #999;
        font-size: 10px;
        line-height: 1;
        flex-shrink: 0;
      }
      .techDetails[open] > summary::before {
        content: "▾";
      }
      .techDetailsTitle {
        font-weight: 500;
        font-size: 11px;
        color: #777;
      }
      .techDetailsBody {
        margin-top: 6px;
        padding-top: 6px;
        border-top: 1px solid #ececec;
      }
      .sheetStatus {
        font-size: 11px;
        line-height: 1.4;

      .sheetStatus.ok {

      }
      .sheetStatus.err {

    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      /** @type {any} */
      const state = {
        summary: null,
        cards: [],
        confirmCards: [],
        lastReport: null,
        sheetLoad: null,
        ui: {
          confirmDetailsOpen: false,
          reportDetailsOpen: false,
          techDetailsOpen: false,
        },
      };

      function sendToPlugin(message) {
        parent.postMessage({ pluginMessage: message }, "*");
      }

      var PLUGIN_UI_WIDTH = 390;
      var PLUGIN_UI_MIN_HEIGHT = 220;
      var PLUGIN_UI_MAX_HEIGHT = Math.min(
        window.screen && window.screen.availHeight ? window.screen.availHeight - 64 : 750,
        750,
      );

      function computePluginContentHeight() {
        return Math.max(
          document.documentElement.scrollHeight,
          document.body ? document.body.scrollHeight : 0,
        );
      }

      function applyPluginScrollMode(contentHeight) {
        var capped = contentHeight > PLUGIN_UI_MAX_HEIGHT;
        var overflow = capped ? "auto" : "";
        document.documentElement.style.overflowY = overflow;
        document.body.style.overflowY = overflow;
      }

      var pluginResizeFrame = 0;
      function schedulePluginResize() {
        if (pluginResizeFrame) {
          cancelAnimationFrame(pluginResizeFrame);
        }
        pluginResizeFrame = requestAnimationFrame(function () {
          pluginResizeFrame = requestAnimationFrame(function () {
            pluginResizeFrame = 0;
            var contentHeight = computePluginContentHeight();
            var targetHeight = Math.max(
              PLUGIN_UI_MIN_HEIGHT,
              Math.min(PLUGIN_UI_MAX_HEIGHT, contentHeight),
            );
            applyPluginScrollMode(contentHeight);
            sendToPlugin({
              type: "ui:resize",
              width: PLUGIN_UI_WIDTH,
              height: targetHeight,
            });
          });
        });
      }

      function detailsOpenAttr(isOpen) {
        return isOpen ? " open" : "";
      }

      function captureUiAccordionState() {
        var confirmEl = document.querySelector("details.confirmDetails");
        if (confirmEl) state.ui.confirmDetailsOpen = confirmEl.open;
        var reportEl = document.querySelector("details.reportDetails");
        if (reportEl) state.ui.reportDetailsOpen = reportEl.open;
        var techEl = document.querySelector("details.techDetails");
        if (techEl) state.ui.techDetailsOpen = techEl.open;
      }

      function wireAccordionResize() {
        document
          .querySelectorAll("details.reportDetails, details.confirmDetails, details.techDetails")
          .forEach(function (el) {
            el.addEventListener("toggle", function () {
              if (el.classList.contains("confirmDetails")) {
                state.ui.confirmDetailsOpen = el.open;
              } else if (el.classList.contains("reportDetails")) {
                state.ui.reportDetailsOpen = el.open;
              } else if (el.classList.contains("techDetails")) {
                state.ui.techDetailsOpen = el.open;
              }
              schedulePluginResize();
            });
          });
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      /**
       * Показать невидимые символы в фрагменте diff (пробел, NBSP, перевод строки).
       * Возвращает HTML — только для вставки в отчёт, не для произвольного текста пользователя.
       */
      function visualizeDiffFragment(text) {
        if (text == null) return '<span class="ws-empty">∅</span>';
        var s = String(text);
        if (s.length === 0) return '<span class="ws-empty">∅</span>';

        var out = "";
        for (var i = 0; i < s.length; i++) {
          var ch = s.charAt(i);
          var code = s.charCodeAt(i);
          if (ch === "\n") {
            out +=
              '<span class="ws-mark ws-nl" title="перевод строки (U+000A)">↵</span>\n';
          } else if (ch === "\t") {
            out += '<span class="ws-mark ws-tab" title="табуляция (U+0009)">⇥</span>';
          } else if (code === 0x00a0) {
            out +=
              '<span class="ws-mark ws-nbsp" title="неразрывный пробел (U+00A0)">□</span>';
          } else if (code === 0x202f) {
            out +=
              '<span class="ws-mark ws-nnbsp" title="узкий неразрывный пробел (U+202F)">▫</span>';
          } else if (ch === " ") {
            out += '<span class="ws-mark ws-sp" title="пробел (U+0020)">·</span>';
          } else {
            out += escapeHtml(ch);
          }
        }
        return out;
      }

      function formatDiffHtml(before, after) {
        return (
          visualizeDiffFragment(before) +
          ' <span style="color:#888;font-weight:400">→</span> <b>' +
          visualizeDiffFragment(after) +
          "</b>"
        );
      }

      var SERVICE_WORD_NBSP_RULE_IDS = {
        "cian-095-nbsp-after-short-words-strict": true,
        "cian-097-nbsp-after-service-words-before-line-end": true,
        "cian-098-nbsp-after-service-words-newlines-before-text": true,
        "cian-099-nbsp-after-service-words-trailing-newlines-at-eof": true,
        "cian-101-nbsp-after-service-words-mixed-ws-before-text": true,
      };

      var SENTENCE_PERIOD_RULE_IDS = {
        "cian-139-sentence-terminal-period": true,
        "cian-139a-implicit-sentence-period": true,
      };

      var WORD_CHAR_RE = /[0-9A-Za-z\u0400-\u04FF\u0451\u0401]/;

      function isWhitespaceOnlyFragment(text) {
        if (text == null || text === "") return true;
        var s = String(text);
        for (var i = 0; i < s.length; i++) {
          var code = s.charCodeAt(i);
          var ch = s.charAt(i);
          if (
            ch !== " " &&
            ch !== "\t" &&
            ch !== "\n" &&
            ch !== "\r" &&
            code !== 0x00a0 &&
            code !== 0x202f
          ) {
            return false;
          }
        }
        return true;
      }

      function isSentenceTerminalPunctuationFragment(text) {
        if (text == null || text === "") return false;
        var s = String(text).trim();
        if (s.length === 0) return false;
        for (var i = 0; i < s.length; i++) {
          var ch = s.charAt(i);
          if (ch !== "." && ch !== "!" && ch !== "?" && ch !== "…") {
            return false;
          }
        }
        return true;
      }

      function extractContextWordBefore(text, index) {
        var i = index - 1;
        while (i >= 0 && WORD_CHAR_RE.test(text.charAt(i))) i--;
        return text.slice(i + 1, index);
      }

      function extractContextWordAfter(text, index) {
        var i = index;
        while (i < text.length && WORD_CHAR_RE.test(text.charAt(i))) i++;
        return text.slice(index, i);
      }

      function formatContextSide(leftWord, fragment, rightWord, bold) {
        var parts = [];
        if (leftWord) {
          parts.push('<span class="reportCtxWord">' + escapeHtml(leftWord) + "</span>");
        }
        parts.push(
          bold ? "<b>" + visualizeDiffFragment(fragment) + "</b>" : visualizeDiffFragment(fragment),
        );
        if (rightWord) {
          parts.push('<span class="reportCtxWord">' + escapeHtml(rightWord) + "</span>");
        }
        return parts.join(" ");
      }

      function formatContextualWhitespaceDiff(sourceText, from, to, before, after) {
        if (!sourceText || from == null || to == null) return null;
        var leftWord = extractContextWordBefore(sourceText, from);
        var rightWord = extractContextWordAfter(sourceText, to);
        if (!leftWord && !rightWord) return null;
        return (
          formatContextSide(leftWord, before, rightWord, false) +
          ' <span style="color:#888;font-weight:400">→</span> ' +
          formatContextSide(leftWord, after, rightWord, true)
        );
      }

      function formatSentencePeriodDiff(sourceText, from, before, after) {
        if (!sourceText || from == null) return null;
        if (!isWhitespaceOnlyFragment(before)) return null;
        if (!isSentenceTerminalPunctuationFragment(after)) return null;
        var word = extractContextWordBefore(sourceText, from);
        if (!word) return null;
        return (
          '<span class="reportCtxWord">' +
          escapeHtml(word) +
          "</span>" +
          ' <span style="color:#888;font-weight:400">→</span> <b>' +
          '<span class="reportCtxWord">' +
          escapeHtml(word + after) +
          "</span></b>"
        );
      }

      function formatFixDiffHtml(fix, sourceText) {
        var enriched = Object.assign({}, fix, {
          sourceText: sourceText != null ? sourceText : fix.sourceText,
        });
        if (
          SENTENCE_PERIOD_RULE_IDS[enriched.ruleId] &&
          enriched.sourceText
        ) {
          var periodDiff = formatSentencePeriodDiff(
            enriched.sourceText,
            enriched.from,
            enriched.before,
            enriched.after,
          );
          if (periodDiff) return periodDiff;
        }
        if (
          SERVICE_WORD_NBSP_RULE_IDS[enriched.ruleId] &&
          isWhitespaceOnlyFragment(enriched.before) &&
          isWhitespaceOnlyFragment(enriched.after) &&
          enriched.sourceText
        ) {
          var contextual = formatContextualWhitespaceDiff(
            enriched.sourceText,
            enriched.from,
            enriched.to,
            enriched.before,
            enriched.after,
          );
          if (contextual) return contextual;
        }
        return formatDiffHtml(enriched.before, enriched.after);
      }

      function displayText(value) {
        if (value == null) return "";
        if (typeof value === "string") return value;
        if (typeof value === "object" && typeof value.message === "string") return value.message;
        try {
          return JSON.stringify(value);
        } catch (e) {
          return String(value);
        }
      }

      function escapeCsvCell(value) {
        const s = value == null ? "" : String(value);
        if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
        return s;
      }

      function gvizJsonToCsv(data) {
        if (!data || data.status === "error") {
          const msg = (data && data.errors && data.errors[0] && data.errors[0].message) || "Ошибка Google Таблицы";
          throw new Error(msg);
        }
        const rows = data.table && data.table.rows;
        if (!rows || !rows.length) throw new Error("Таблица пуста");
        return rows
          .map(function (row) {
            const cells = row.c || [];
            return cells
              .map(function (cell) {
                return cell && cell.v != null ? escapeCsvCell(cell.v) : "";
              })
              .join(",");
          })
          .join("\n");
      }

      /** Google Sheets в Figma: fetch блокируется CORS → загрузка через <script> (gviz JSON). */
      function fetchSheetViaGvizJsonp(spreadsheetId, gid) {
        return new Promise(function (resolve, reject) {
          const url =
            "https://docs.google.com/spreadsheets/d/" +
            spreadsheetId +
            "/gviz/tq?gid=" +
            encodeURIComponent(gid) +
            "&tqx=out:json";
          let script = null;
          const timer = setTimeout(function () {
            if (script && script.parentNode) script.parentNode.removeChild(script);
            reject(new Error("Таймаут загрузки таблицы"));
          }, 24000);

          window.google = window.google || {};
          window.google.visualization = window.google.visualization || {};
          window.google.visualization.Query = {
            setResponse: function (data) {
              clearTimeout(timer);
              if (script && script.parentNode) script.parentNode.removeChild(script);
              try {
                resolve(gvizJsonToCsv(data));
              } catch (e) {
                reject(e);
              }
            },
          };

          script = document.createElement("script");
          script.src = url;
          script.onerror = function () {
            clearTimeout(timer);
            reject(
              new Error(
                "Браузер заблокировал загрузку таблицы. Проверьте доступ «все с ссылкой» → Читатель.",
              ),
            );
          };
          document.head.appendChild(script);
        });
      }

      var REPORT_THANKS_HTML =
        '<div class="reportThanksRow">' +
        '<button id="thanksBtn" type="button" class="thanksBtn">Спасибо, шайтан-машина!</button>' +
        "</div>";

      function wrapReportInDetails(bodyHtml) {
        return `
          <div class="reportBlock">
            <details class="reportDetails"${detailsOpenAttr(state.ui.reportDetailsOpen)}>
              <summary class="reportDetailsSummary">
                <span class="reportDetailsTitle">Что исправлено</span>
              </summary>
              <div class="reportDetailsBody">${bodyHtml}</div>
            </details>
          </div>
        `;
      }

      function renderResultHeaderHtml() {
        if (!state.summary) {
          return '<div class="resultWaiting">Шуршу по макету…</div>';
        }
        const applied = state.lastReport ? state.lastReport.summary.appliedFixCount : 0;
        const confirmCount = state.confirmCards.reduce(function (n, c) {
          return n + (c.fixes ? c.fixes.length : 0);
        }, 0);
        return `
          <div class="resultHeader">
            <h1 class="resultTitle">Проверка окончена</h1>
            <div class="resultStats">
              <div class="resultStat">
                <div class="resultStatLabel">Проверено слоёв</div>
                <div class="resultStatValue">${state.summary.checkedLayers}</div>
              </div>
              <div class="resultStat">
                <div class="resultStatLabel">Исправлено</div>
                <div class="resultStatValue">${applied}</div>
              </div>
              <div class="resultStat">
                <div class="resultStatLabel">На подтверждение</div>
                <div class="resultStatValue">${confirmCount}</div>
              </div>
            </div>
          </div>
        `;
      }

      function renderTechDetailsHtml() {
        const sl = state.sheetLoad;
        let bodyHtml = "";

        if (!sl) {
          bodyHtml = '<div class="empty" style="padding:4px 0">Статус загрузки таблицы ещё не получен.</div>';
        } else if (sl.fromRemote && sl.ok) {
          const extra =
            sl.bundledOnlyRuleCount && sl.bundledOnlyRuleCount > 0
              ? `, из сборки: <b>${sl.bundledOnlyRuleCount}</b>`
              : "";
          bodyHtml = `<div class="sheetStatus ok">Загружено правил замен: <b>${sl.ruleCount}</b> (таблица: <b>${sl.remoteRuleCount ?? 0}</b>${extra}).</div>`;
        } else if (!sl.ok) {
          bodyHtml = `<div class="sheetStatus err">Таблица не загрузилась — встроенный CSV (${sl.ruleCount} прав.). ${escapeHtml(
            displayText(sl.errorMessage)
          )}</div>`;
        } else {
          bodyHtml = `<div class="sheetStatus ok">Используется встроенный CSV: <b>${sl.ruleCount}</b> прав.</div>`;
        }

        return `
          <div class="techBlock">
            <details class="techDetails"${detailsOpenAttr(state.ui.techDetailsOpen)}>
              <summary>
                <span class="techDetailsTitle">Техническая хрень</span>
              </summary>
              <div class="techDetailsBody">${bodyHtml}</div>
            </details>
          </div>
        `;
      }

      function renderReportHtml() {
        const r = state.lastReport;
        if (!r) {
          return "";
        }
        if (!r.layers.length) {
          if (state.summary && state.summary.foundFixes === 0) {
            return '<div class="empty" style="padding:4px 0;margin-bottom:14px">В выделенных слоях правок нет</div>';
          }
          return "";
        }
        const layerBlocks = r.layers
          .map((layer) => {
            const fixesHtml = layer.fixes
              .map((f) => {
                return `
                  <div class="reportFix">
                    <div class="reportWhy">${escapeHtml(f.message)}</div>
                    <div class="reportMeta">Правило: <code>${escapeHtml(f.ruleId)}</code> · ${escapeHtml(
                  f.category
                )}</div>
                    <div class="reportDiff">${formatFixDiffHtml(f, f.sourceText)}</div>
                  </div>
                `;
              })
              .join("");
            return `
              <div class="reportLayer">
                <div class="reportLayerTitle" data-node-id="${escapeHtml(layer.nodeId)}">${escapeHtml(
                  layer.nodeName || "Без имени"
                )}</div>
                ${fixesHtml}
              </div>
            `;
          })
          .join("");

        return wrapReportInDetails(layerBlocks);
      }

      function renderConfirmHtml() {
        if (!state.confirmCards.length) return "";
        const layerBlocks = state.confirmCards
          .map((layer, cardIdx) => {
            const fixesHtml = layer.fixes
              .map((f, fixIdx) => {
                const ruleId = f.rule && f.rule.id ? f.rule.id : "";
                const category = f.rule && f.rule.category ? f.rule.category : "";
                const message = f.rule && f.rule.message ? f.rule.message : "";
                return `
                  <div class="confirmFix" data-confirm-card="${cardIdx}" data-confirm-fix="${fixIdx}">
                    <div class="reportWhy">${escapeHtml(message)}</div>
                    <div class="reportMeta">Правило: <code>${escapeHtml(ruleId)}</code> · ${escapeHtml(
                  category
                )}</div>
                    <div class="reportDiff">${formatFixDiffHtml(
                      {
                        ruleId: ruleId,
                        from: f.from,
                        to: f.to,
                        before: f.before,
                        after: f.after,
                      },
                      layer.originalText,
                    )}</div>
                    <div class="confirmActions">
                      <button type="button" class="confirmApplyBtn" data-confirm-apply="${cardIdx}:${fixIdx}">
                        Принять
                      </button>
                      <button type="button" class="confirmSkipBtn" data-confirm-skip="${cardIdx}:${fixIdx}">
                        Пропустить
                      </button>
                    </div>
                  </div>
                `;
              })
              .join("");
            return `
              <div class="reportLayer">
                <div class="reportLayerTitle" data-node-id="${escapeHtml(layer.nodeId)}">${escapeHtml(
                  layer.nodeName || "Без имени"
                )}</div>
                ${fixesHtml}
              </div>
            `;
          })
          .join("");

        return `
          <div class="confirmBlock">
            <details class="confirmDetails"${detailsOpenAttr(state.ui.confirmDetailsOpen)}>
              <summary class="confirmDetailsSummary">
                <span class="confirmDetailsTitle">Требуют подтверждения</span>
              </summary>
              <div class="confirmDetailsBody">${layerBlocks}</div>
            </details>
          </div>
        `;
      }

      function skipConfirmFix(cardIdx, fixIdx) {
        const card = state.confirmCards[cardIdx];
        if (!card || !card.fixes[fixIdx]) return;
        card.fixes.splice(fixIdx, 1);
        if (card.fixes.length === 0) {
          state.confirmCards.splice(cardIdx, 1);
        }
        if (state.summary) {
          state.summary.confirmFixes = state.confirmCards.reduce(function (n, c) {
            return n + c.fixes.length;
          }, 0);
        }
        render();
      }

      function wireConfirmButtons() {
        document.querySelectorAll("[data-confirm-apply]").forEach((el) => {
          el.addEventListener("click", (event) => {
            event.stopPropagation();
            const key = el.getAttribute("data-confirm-apply");
            if (!key) return;
            const parts = key.split(":");
            const cardIdx = Number(parts[0]);
            const fixIdx = Number(parts[1]);
            const card = state.confirmCards[cardIdx];
            if (!card) return;
            const fix = card.fixes[fixIdx];
            if (!fix) return;
            state.ui.confirmDetailsOpen = true;
            sendToPlugin({
              type: "ui:applyConfirmFix",
              nodeId: card.nodeId,
              fix: fix,
            });
          });
        });
        document.querySelectorAll("[data-confirm-skip]").forEach((el) => {
          el.addEventListener("click", (event) => {
            event.stopPropagation();
            const key = el.getAttribute("data-confirm-skip");
            if (!key) return;
            const parts = key.split(":");
            skipConfirmFix(Number(parts[0]), Number(parts[1]));
          });
        });
      }

      function render() {
        const app = document.getElementById("app");
        if (!app) return;

        captureUiAccordionState();

        const resultHeaderHtml = renderResultHeaderHtml();
        const confirmHtml = renderConfirmHtml();
        const reportHtml = renderReportHtml();
        const thanksHtml = state.summary ? REPORT_THANKS_HTML : "";

        let bodyHtml = "";
        if (state.cards.length) {
          bodyHtml = state.cards
            .map((c) => {
              return `
              <div class="card cardClickable" data-node-id="${escapeHtml(c.nodeId)}">
                <div class="cardTitle">${escapeHtml(c.nodeName || "Без имени")}</div>
                <div class="fieldLabel">Текст слоя сейчас</div>
                <div class="textPreview">${escapeHtml(c.originalText)}</div>
                <div class="fieldLabel" style="color:#888;font-size:11px">Если снова нужны правки — измените текст или выделение и снова запустите плагин.</div>
              </div>
            `;
            })
            .join("");
        }

        const techDetailsHtml = renderTechDetailsHtml();

        app.innerHTML = `
          <div class="appShell">
            <div class="appMain">
              ${resultHeaderHtml}
              ${reportHtml}
              ${confirmHtml}
              ${thanksHtml}
              ${
                state.cards.length
                  ? `<div class="sectionTitle">Оставшиеся совпадения (если есть)</div><div class="cards">${bodyHtml}</div>`
                  : ""
              }
            </div>
            ${techDetailsHtml}
          </div>
        `;

        wireButtons();
        wireConfirmButtons();
        wireReportLayerClicks();
        wireCardClicks();
        wireAccordionResize();
        schedulePluginResize();
      }

      function wireButtons() {
        const thanksBtn = document.getElementById("thanksBtn");
        if (thanksBtn) {
          thanksBtn.onclick = () => sendToPlugin({ type: "ui:close" });
        }
      }

      function wireReportLayerClicks() {
        document.querySelectorAll(".reportLayerTitle[data-node-id]").forEach((el) => {
          el.addEventListener("click", () => {
            const nodeId = el.getAttribute("data-node-id");
            if (!nodeId) return;
            sendToPlugin({ type: "ui:focusLayer", nodeId });
          });
        });
      }

      function wireCardClicks() {
        document.querySelectorAll(".card[data-node-id]").forEach((el) => {
          el.addEventListener("click", () => {
            const nodeId = el.getAttribute("data-node-id");
            if (!nodeId) return;
            sendToPlugin({ type: "ui:focusLayer", nodeId });
          });
        });
      }

      window.addEventListener("message", (event) => {
        const msg = event.data && event.data.pluginMessage;
        if (!msg) return;

        if (msg.type === "plugin:error") {
          state.summary = null;
          state.lastReport = null;
          state.cards = [];
          const app = document.getElementById("app");
          if (app) {
            app.innerHTML =
              '<div style="color:#b00020;padding:12px"><b>Ошибка плагина</b><br>' +
              escapeHtml(msg.message || "Неизвестная ошибка") +
              "</div>";
          }
          return;
        }

        if (msg.type === "plugin:fetchSheetCsv") {
          const requestId = msg.requestId;
          const spreadsheetId = msg.spreadsheetId;
          const gid = msg.gid != null ? String(msg.gid) : "0";
          const fetchUrl = msg.fetchUrl || "";
          fetchSheetViaGvizJsonp(spreadsheetId, gid)
            .then(function (csv) {
              sendToPlugin({
                type: "ui:sheetCsvResult",
                requestId: requestId,
                ok: true,
                csv: csv,
                fetchUrl: fetchUrl,
              });
            })
            .catch(function (e) {
              sendToPlugin({
                type: "ui:sheetCsvResult",
                requestId: requestId,
                ok: false,
                errorMessage: e && e.message ? e.message : String(e),
                fetchUrl: fetchUrl,
              });
            });
          return;
        }

        if (msg.type === "plugin:config") {
          state.sheetLoad = msg.sheetLoad != null ? msg.sheetLoad : null;
          render();
          return;
        }

        if (msg.type === "plugin:checkResult") {
          state.summary = msg.result.summary;
          state.lastReport = msg.result.lastAutoApplyReport != null ? msg.result.lastAutoApplyReport : null;
          state.cards = msg.result.cards.map((c) => ({
            nodeId: c.nodeId,
            nodeName: c.nodeName,
            originalText: c.originalText,
            previewText: c.previewText,
            fixes: c.fixes,
          }));
          state.confirmCards = (msg.result.confirmCards || []).map((c) => ({
            nodeId: c.nodeId,
            nodeName: c.nodeName,
            originalText: c.originalText,
            previewText: c.previewText,
            fixes: c.fixes,
          }));
          render();
        }
      });

      sendToPlugin({ type: "ui:ready" });
      render();
    </script>
  </body>
</html>
